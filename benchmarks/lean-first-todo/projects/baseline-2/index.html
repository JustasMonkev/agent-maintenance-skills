<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Todo notebook</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><p class="eyebrow">A little room for what matters</p><h1>Todo notebook</h1></header>
<form id="add-form"><label for="new-todo">New todo</label><div class="add-row"><input id="new-todo" name="title" autocomplete="off" placeholder="What needs doing?"><button>Add</button></div></form>
<div class="toolbar"><nav aria-label="Filter todos"><button type="button" data-filter="all" aria-pressed="true">All</button><button type="button" data-filter="active" aria-pressed="false">Active</button><button type="button" data-filter="completed" aria-pressed="false">Completed</button></nav><span data-testid="remaining"></span></div>
<ul data-testid="todo-list"></ul>
<p id="empty">Your notebook is clear. Add a task above.</p>
<footer><button id="clear" type="button">Clear completed</button></footer>
<p id="status" role="status" aria-live="polite"></p>
</main><script type="module" src="app.mjs"></script></body></html>
